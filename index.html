<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SwarajyaVerse Studio | AI, Games, Books & Learning</title>
    <meta name="description" content="Explore SwarajyaVerse Studio, a creative digital world featuring AI experiments, games, study resources, quizzes, Maharashtra history, books, and inspiration.">
    <meta name="robots" content="index, follow">

    <style>
        :root {
            --gold: #ffca70;
            --text: #ffffff;
            --panel: rgba(8, 13, 25, 0.75);
            --border: rgba(255, 202, 112, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(3, 10, 24, 0.52),
                    rgba(3, 10, 24, 0.70)
                ),
                url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2200&q=85")
                center / cover fixed;
            transition: background 0.4s, color 0.4s;
        }

        body.light {
            background:
                linear-gradient(
                    rgba(0, 30, 48, 0.12),
                    rgba(0, 30, 48, 0.30)
                ),
                url("https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?auto=format&fit=crop&w=2200&q=85")
                center / cover fixed;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        header {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 18px 6%;
            background: rgba(5, 9, 20, 0.72);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .brand {
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--gold);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a,
        .theme-button {
            font-size: 14px;
            color: white;
            transition: color 0.25s;
        }

        nav a:hover,
        .theme-button:hover {
            color: var(--gold);
        }

        .theme-button {
            background: transparent;
            border: 1px solid var(--border);
            padding: 9px 13px;
            border-radius: 30px;
            cursor: pointer;
        }

        .hero {
            min-height: 84vh;
            padding: 70px 20px 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo {
            width: 112px;
            height: 112px;
            object-fit: contain;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 18px rgba(255, 202, 112, 0.5));
            animation: float 4s ease-in-out infinite;
        }

        .kicker {
            color: var(--gold);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 16px;
            animation: reveal 1s both;
        }

        .hero h1 {
            font-size: clamp(38px, 8vw, 86px);
            line-height: 1.08;
            letter-spacing: 2px;
            text-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
            animation: reveal 1s 0.15s both;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .studio {
            font-size: clamp(14px, 2.5vw, 22px);
            letter-spacing: 10px;
            margin-top: 15px;
            animation: reveal 1s 0.3s both;
        }

        .tagline {
            min-height: 35px;
            margin: 28px 0 12px;
            font-size: clamp(15px, 2.5vw, 21px);
            color: white;
        }

        #typing {
            border-right: 2px solid var(--gold);
            padding-right: 5px;
        }

        .credit {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.8;
            color: #fff0d0;
        }

        .explore {
            display: inline-block;
            margin-top: 32px;
            padding: 15px 26px;
            border-radius: 40px;
            color: #172033;
            background: var(--gold);
            font-weight: bold;
            box-shadow: 0 0 25px rgba(255, 202, 112, 0.22);
            transition: transform 0.25s, box-shadow 0.25s;
            animation: reveal 1s 0.45s both;
        }

        .explore:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 35px rgba(255, 202, 112, 0.5);
        }

        /* ABOUT ME SECTION */

            display: none;
            max-width: 900px;
            margin: 30px auto 70px;
            padding: 0 22px;
            scroll-margin-top: 30px;
        }

        .about.visible {
            display: block;
            animation: reveal 0.8s both;
        }
